name: MariaDB and browser acceptance
on:
  pull_request:
  push:
    branches: [rebuild/web-replacement]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Debian 13 / MariaDB / Chromium isolated suite
        run: bash ops/test-isolated.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-acceptance-reports
          path: docs/testing/generated/
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Interactive fresh Debian 13 installer (no systemd PID-1 or public ACME)
        run: bash ops/test-installer.sh
